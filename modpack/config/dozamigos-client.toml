#URL do manifest JSON do pack. Vazio = default do jar (repo DozamigosUpdater).
manifestUrl = "https://raw.githubusercontent.com/luanwolf/DozamigosUpdater/main/dozamigos-manifest.json"
#Token GitHub opcional (repos privados / rate limit). Deixe vazio se publico.
githubToken = ""
#Checa atualizacoes ao abrir o menu principal e mostra popup se houver mudanca.
checkOnTitleScreen = true
#Mostra botao "Verificar atualizacao" acima de Um Jogador (FancyMenu pode esconder; use a action/comando).
showTitleButton = true
#Timeout de conexao HTTP em ms.
#Range: 1000 ~ 120000
connectTimeoutMs = 15000
#Timeout de leitura HTTP em ms.
#Range: 1000 ~ 600000
readTimeoutMs = 120000
